general {
    # avoid starting multiple hyprlock instances. Log to the journal
    # (journalctl -t hyprlock) so a frozen lock screen can be traced.
    # --immediate-render draws without waiting for the background and labels,
    # which can stay pending forever after a resume (hyprlock issue #1071).
    lock_cmd = pidof hyprlock || systemd-cat -t hyprlock hyprlock --verbose --immediate-render
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'  # to avoid having to press a key twice to turn on the display.
    inhibit_sleep = 3                           # makes your system wait until the session gets locked by a lock screen app
}

listener {
    timeout = 120                                # 2min.
    on-timeout = brightnessctl -d intel_backlight -s set 5          # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -d intel_backlight -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener { 
    timeout = 90                                               # 1.5min.
    on-timeout = brightnessctl -sd tpacpi::kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd tpacpi::kbd_backlight        # turn on keyboard backlight.
}

listener {
    timeout = 1800                                # 30min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 2700                                # 45min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})' # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'   # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 3600                                # 60min
    on-timeout = systemctl suspend                # suspend pc
}
