# Give the Thunderbolt dock time to bring its monitors back after a resume.
# logind ignores a closed lid for this long after a suspend is requested, but
# the timer also runs while the system prepares to sleep (~19 s here), so the
# default 30 s left only ~11 s after waking. The MST dock monitors were not
# back yet, logind thought the laptop was undocked and suspended it again
# mid-wakeup, which left i915 rejecting every mode (black screens).
[Login]
HoldoffTimeoutSec=90s
