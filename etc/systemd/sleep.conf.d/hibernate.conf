# Keep the default "platform" mode (ACPI S4). "shutdown" hangs at power-off:
# the NVIDIA driver suspends the dGPU while the image is created and does not
# wake it again (nv_pmops_thaw is a no-op), then its shutdown handler tears
# the suspended GPU down and loops on "TLB invalidation failed" with the fans
# running. Platform mode calls the driver's poweroff hook (also a no-op)
# instead, and saves/restores the ACPI NVS memory.
# S4 lets USB and Thunderbolt wake the laptop; the system-sleep hook
# hibernate-wakeup turns those wakeups off while hibernated.
[Sleep]
HibernateMode=platform
