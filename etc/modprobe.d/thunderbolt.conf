# Never give up on a dock DP tunnel. After a hibernation the tunnel to a dock
# monitor is rebuilt, but it only becomes active once i915 reads the monitor
# (DPRX). If that takes longer than 12 s (the default), the driver tears the
# tunnel down and marks the laptop's DP IN adapter unusable until reboot: the
# screens stay dark until the dock is unplugged, and after re-plugging one
# monitor stays black because only one DP IN is left (drivers/thunderbolt/tb.c,
# tb_dp_tunnel_active: "not active, tearing down"). -1 waits forever.
# Needs kernel 7.2.14 or newer: older kernels wait for that timeout when the
# driver stops ("thunderbolt: Tear down inactive DP tunnels when the domain
# is stopped"), so -1 could hang an unbind or shutdown forever.
options thunderbolt dprx_timeout=-1
