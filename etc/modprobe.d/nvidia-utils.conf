# Overrides /usr/lib/modprobe.d/nvidia-utils.conf (same name wins) to drop
# nvidia-drm from the softdep; it is blocked in nvidia.conf. Re-check this
# against the packaged file after nvidia-utils updates.
blacklist nouveau
blacklist nova_core
blacklist nova_drm

softdep nvidia post: nvidia-uvm

options nvidia NVreg_UseKernelSuspendNotifiers=1
options nvidia NVreg_TemporaryFilePath=/var/tmp
