options nvidia NVreg_DynamicPowerManagement=0x02

# Never load the NVIDIA display stack. nvidia-modeset registers a bogus
# nvidia_0 backlight after resume, and nvKmsResume then deadlocks with anything
# reading it (waybar, systemd-backlight), hanging s2idle resume on the console.
# Costs: no displays on dGPU ports and no prime-run for Vulkan/GL presentation.
# nvidia + nvidia_uvm (CUDA, runtime power management) still load.
install nvidia_modeset /bin/false
install nvidia_drm /bin/false
